<!DOCTYPE html>
<html>
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<body>

<h2>Registrar Colaborador</h2>

<form action="" id="registrarForm">
  Matricula:<br>
  <input type="text" name="registration" value="0000" id="registration">
  <br>
  Nome:<br>
  <input type="text" name="name" value="Augusto" id="name">
  <br><br>
  Data Nascimento:<br>
  <input type="text" name="birth" value="24/04/1997" id="birth">
  <br><br>

  Setor:<br>
  <select id="selectSector">
    <option>Choose a sector</option>
  </select>
  <br><br>
  Frente:<br>
  <select id="selectSubSector">
    <option>Choose a subsector</option>
  </select>
  <br><br>

  <input type="submit" id="btnsend" value="Send" name="send">
</form> 


<script>
  window.onload = function(e){
    var selectSectorField = document.getElementById('selectSector')
    var selectSubSectorField = document.getElementById('selectSubSector');
    var members = [];
    axios.get('http://localhost:3000/sectors').then(function(response){
            console.log(response.data);
            for(var i = 0; i < response.data.length; ++i){
              var opt = document.createElement("option");
              
              opt.text = response.data[i].name;
              opt.value = response.data[i]._id;
              selectSectorField.appendChild(opt);

              members.push(response.data[i].members);

            }
            console.log("OK");
        }).catch(e=>{
            console.log("BILU" + e.response);
            
        });
    var btn = document.getElementById("btnsend");
    var form = document.getElementById("registrarForm");
    btn.addEventListener("click", function(e){
      e.preventDefault();
      console.log(form.elements.selectSector.value);
    });
    selectSector.addEventListener("change", function(e){
      e.preventDefault();
      console.log(e, members,selectSector.selectedIndex);
      var idx = selectSector.selectedIndex;
      selectSubSectorField.innerHTML = "<option>Choose a subsector</option>";
      for(var i = 0; i < members[idx-1].length; ++i){
              var opt = document.createElement("option");
              
              opt.text = members[idx-1][i].name;
              opt.value = members[idx-1][i]._id;
              selectSubSectorField.appendChild(opt);

            }
    });
  }
</script>

</body>
</html>
